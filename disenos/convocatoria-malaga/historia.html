<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
:root{--brand:#006DA6;--brand-deep:#00527E;--brand-light:#BFDCF0;--grey:#4C4C4C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Montserrat",sans-serif;background:var(--brand);position:relative;color:#fff}
.foto{position:absolute;top:0;left:0;width:1080px;height:700px;object-fit:cover;object-position:50% 40%}
.sombra{position:absolute;top:0;left:0;right:0;height:700px;background:linear-gradient(180deg,rgba(0,40,70,.45) 0%,rgba(0,40,70,0) 28%,rgba(0,109,166,0) 70%,rgba(0,109,166,.6) 100%)}
.logo{position:absolute;top:44px;left:56px;background:#fff;border-radius:20px;padding:12px 18px;width:290px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo img{width:100%;display:block}
.chip{position:absolute;top:580px;left:64px;display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:14px 28px;
  font-family:"Space Mono",monospace;font-weight:700;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--brand);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.chip i{width:14px;height:14px;border-radius:50%;background:#1DB954;display:block;box-shadow:0 0 0 6px rgba(29,185,84,.2)}
.panel{position:absolute;top:668px;left:0;right:0;bottom:0;background:var(--brand);border-radius:44px 44px 0 0;padding:46px 64px 0}
.kicker{font-family:"Space Mono",monospace;font-weight:700;font-size:25px;letter-spacing:4px;text-transform:uppercase;color:var(--brand-light);display:flex;align-items:center;gap:12px}
.kicker svg{width:28px;height:28px}
.titular{font-weight:900;font-size:76px;white-space:nowrap;line-height:1.02;letter-spacing:-2px;margin-top:12px}
.titular span{background:linear-gradient(transparent 62%,rgba(255,255,255,.28) 62%,rgba(255,255,255,.28) 94%,transparent 94%);padding:0 6px}
.cursos{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.curso{display:flex;align-items:center;gap:22px;background:#fff;border-radius:22px;padding:16px 24px;color:var(--grey);box-shadow:0 8px 22px rgba(0,30,60,.18)}
.curso .ico{flex:none;width:62px;height:62px;border-radius:16px;background:#E6F2FA;display:grid;place-items:center}
.curso .ico svg{width:38px;height:38px}
.curso .cod{font-family:"Space Mono",monospace;font-weight:700;font-size:20px;letter-spacing:2px;color:var(--brand)}
.curso .nom{font-weight:800;font-size:31px;line-height:1.12;color:#1F2A33;letter-spacing:-.3px}
.pie{position:absolute;left:64px;right:64px;bottom:44px;display:flex;align-items:center;justify-content:space-between}
.pie .ok{display:flex;gap:26px;font-weight:700;font-size:27px;color:#E6F2FA}
.pie .ok span{display:flex;align-items:center;gap:10px}
.pie .ok svg{width:28px;height:28px}
.wa{display:flex;align-items:center;gap:12px;background:#fff;color:var(--brand);border-radius:999px;padding:12px 24px 12px 14px;font-weight:900;font-size:30px;letter-spacing:.5px}
.wa svg{width:38px;height:38px}

/* historia 1080x1920: zonas seguras arriba (~250) y abajo (~340) */
.foto,.sombra{height:820px}
.foto{object-position:50% 50%}
.logo{top:190px;left:50%;transform:translateX(-50%);width:400px;padding:16px 24px}
.chip{top:700px;left:64px}
.panel{top:790px;padding:50px 64px 0}
.titular{font-size:96px;white-space:normal;line-height:1.0;margin-top:14px}
.cursos{margin-top:34px;gap:16px}
.curso{padding:20px 26px}
.pie{bottom:350px}
</style></head><body>
<img class="foto" src="assets/foto2.png" alt="">
<div class="sombra"></div>
<div class="logo"><img src="assets/logo-alacon-novantis.png" alt="Alacon Formación × Novantis Formación"></div>
<div class="chip"><i></i>Convocatoria abierta</div>

<div class="panel">
  <div class="kicker">
    <svg viewBox="0 0 24 24" fill="none" stroke="#BFDCF0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
    Málaga · Certificados oficiales
  </div>
  <div class="titular">Centro <span>oficial</span> presencial</div>

  <div class="cursos">
    <div class="curso">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#006DA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-6.5-4.1-6.5-9A3.6 3.6 0 0 1 12 8.6 3.6 3.6 0 0 1 18.5 11c0 4.9-6.5 9-6.5 9z"/><path d="M2.5 14.5h3l2 2.5M21.5 14.5h-3l-2 2.5"/></svg></div>
      <div><div class="cod">SSCS0208</div><div class="nom">Atención sociosanitaria a personas dependientes</div></div>
    </div>
    <div class="curso">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#006DA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8M8 16h5"/></svg></div>
      <div><div class="cod">ADG305_1</div><div class="nom">Operaciones auxiliares administrativas</div></div>
    </div>
    <div class="curso">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#006DA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><circle cx="12" cy="13.5" r="2"/><path d="M12 15.5V18"/></svg></div>
      <div><div class="cod">COMT0111</div><div class="nom">Gestión comercial inmobiliaria</div></div>
    </div>
  </div>
</div>

<div class="pie">
  <div class="ok">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7"/></svg>Con prácticas en empresas</span>
  </div>
  <div class="wa"><svg viewBox="0 0 24 24" fill="#25D366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>611 12 62 64</div>
</div>
</body></html>
