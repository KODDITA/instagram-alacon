<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
:root{--brand:#006DA6;--brand-deep:#00527E;--brand-light:#BFDCF0;--grey:#4C4C4C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:"Montserrat",sans-serif;background:var(--brand);position:relative;color:#fff}
.foto{position:absolute;top:0;left:0;width:1080px;height:810px;object-fit:cover}
.sombra{position:absolute;top:610px;left:0;right:0;height:200px;background:linear-gradient(180deg,rgba(0,109,166,0),rgba(0,109,166,.55))}
.chip{position:absolute;top:680px;left:70px;display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:14px 28px;
  font-family:"Space Mono",monospace;font-weight:700;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--brand);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--brand);display:block}
.panel{position:absolute;top:780px;left:0;right:0;bottom:0;background:var(--brand);border-radius:44px 44px 0 0;padding:58px 70px 0}
.kicker{font-family:"Space Mono",monospace;font-weight:700;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--brand-light)}
.titular{font-weight:900;font-size:86px;white-space:nowrap;line-height:1.02;letter-spacing:-2px;margin-top:14px}
.titular span{background:linear-gradient(transparent 64%,rgba(255,255,255,.28) 64%,rgba(255,255,255,.28) 94%,transparent 94%);padding:0 6px}
.sub{font-weight:700;font-size:32px;line-height:1.3;margin-top:22px;color:#E6F2FA;max-width:900px}
.pie{position:absolute;left:70px;right:70px;bottom:52px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(255,255,255,.25);padding-top:28px}
.pie .lema{font-weight:900;font-size:34px}
.pie .logo{background:#fff;border-radius:20px;padding:12px 18px;width:300px}
.pie .logo img{width:100%;display:block}
</style></head><body>
<img class="foto" src="assets/firma.jpg" alt="">
<div class="sombra"></div>
<div class="chip"><i></i>Noticia</div>
<div class="panel">
  <div class="kicker">Acuerdo de colaboración</div>
  <div class="titular">Nos unimos a <span>ACEB</span></div>
  <div class="sub">Asociación de Comerciantes y Empresarios de Benalmádena</div>
</div>
<div class="pie">
  <div class="lema">Juntos llegamos más lejos 💙</div>
  <div class="logo"><img src="assets/logo-alacon-novantis.png" alt="Alacon Formación × Novantis Formación"></div>
</div>
</body></html>
