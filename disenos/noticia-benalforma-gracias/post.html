<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
/* 1080×1350 · portada del carrusel */
:root{--brand:#006DA6;--brand-deep:#00527E;--brand-light:#BFDCF0;--grey:#4C4C4C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:"Montserrat",sans-serif;background:#E1EEF7;position:relative;color:#fff}
.foto{position:absolute;top:0;left:0;right:0;height:820px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.chip{position:absolute;top:56px;left:60px;display:inline-flex;align-items:center;gap:14px;background:var(--brand);border-radius:999px;padding:14px 28px;
  font-family:"Space Mono",monospace;font-weight:700;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#fff;box-shadow:0 10px 30px rgba(0,82,126,.35);transform:rotate(-4deg)}
.chip i{width:14px;height:14px;border-radius:50%;background:#fff;display:block}
.panel{position:absolute;top:760px;left:0;right:0;bottom:0;background:var(--brand);border-radius:44px 44px 0 0;padding:50px 70px 0}
.kicker{font-family:"Space Mono",monospace;font-weight:700;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:var(--brand-light)}
.titular{font-weight:900;font-size:80px;white-space:nowrap;line-height:1.02;letter-spacing:-2px;margin-top:12px}
.titular span{background:linear-gradient(transparent 64%,rgba(255,255,255,.28) 64%,rgba(255,255,255,.28) 94%,transparent 94%);padding:0 6px}
.sub{font-weight:700;font-size:30px;line-height:1.3;margin-top:16px;color:#E6F2FA}
.datos{display:flex;gap:18px;margin-top:28px}
.dato{flex:1;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);border-radius:24px;padding:22px 22px;font-weight:900;font-size:29px;line-height:1.2}
.pie{position:absolute;left:70px;right:70px;bottom:44px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(255,255,255,.25);padding-top:24px}
.pie .lema{font-weight:900;font-size:30px;line-height:1.2}
.pie .logo{background:#fff;border-radius:20px;padding:12px 18px;width:280px}
.pie .logo img{width:100%;display:block}
</style></head><body>
<div class="foto"><img src="assets/f1.jpg" alt=""></div>
<div class="chip"><i></i>Noticia</div>
<div class="panel">
  <div class="kicker">Benalforma · Ayto. de Benalmádena</div>
  <div class="titular">Hablan de <span>nosotros</span></div>
  <div class="sub">Jornada con el alumnado de «Benalmádena Enseña»</div>
  <div class="datos">
    <div class="dato">Gestión documental</div>
    <div class="dato">Proyectos formativos</div>
    <div class="dato">Plataformas de formación</div>
  </div>
</div>
<div class="pie">
  <div class="lema">¡Gracias por contar<br>con nosotros! 💙</div>
  <div class="logo"><img src="assets/logo-alacon-novantis.png" alt="Alacon Formación × Novantis Formación"></div>
</div>
</body></html>
