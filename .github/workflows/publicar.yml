name: Publicar en Instagram

on:
  # La programación diaria la lleva Metricool. Este flujo queda solo para lanzarlo a mano.
  # Para volver a publicar desde GitHub cada día, añade de nuevo:
  # schedule:
  #   - cron: "0 7 * * *"
  #   - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a publicar (AAAA-MM-DD). Vacío = hoy"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar lo de hoy
        env:
          META_TOKEN_ALACON: ${{ secrets.META_TOKEN_ALACON }}
          META_TOKEN_NOVANTIS: ${{ secrets.META_TOKEN_NOVANTIS }}
          FECHA: ${{ github.event.inputs.fecha }}
        run: |
          if [ -n "$FECHA" ]; then
            python publicar.py --fecha "$FECHA"
          else
            python publicar.py --desde-hora 9
          fi

      - name: Guardar qué se ha publicado
        if: always()
        run: |
          git config user.name "publicador-instagram"
          git config user.email "publicador@users.noreply.github.com"
          git add contenido/*/publicado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publicado $(date +%F)" && git push)
